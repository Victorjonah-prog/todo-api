<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Todo App</h1>
        <p class="text-gray-600 mb-8">Manage your tasks efficiently</p>
        
        <div class="space-y-4">
            <a 
                href="login.html"
                class="block w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-200"
            >
                Login
            </a>
            
            <a 
                href="register.html"
                class="block w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition duration-200"
            >
                Register
            </a>
            
            <a 
                href="guest-dashboard.html"
                class="block w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition duration-200"
            >
                Continue as Guest
            </a>
        </div>
        
        <p class="mt-8 text-gray-500 text-sm">
            Guest todos are public and visible to everyone
        </p>
    </div>
</body>
</html>
